name: Build and deploy docs site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ghcr.io/mint-cocoa/mintcocoa-docs

concurrency:
  group: docs-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build docs site
        run: bash scripts/build-site.sh

      - name: Verify ServerCore generated portfolio
        run: |
          set -euo pipefail
          test -f _site/portfolio/servercore/index.html
          test -f _site/portfolio/servercore/chapters/01-overview.html
          test -f _site/portfolio/servercore/chapters/06-summary.html
          test ! -f _site/portfolio/servercore/chapters/07-git-history-timeline.html
          test -f _site/portfolio/servercore/downloads/ServerCore-Portfolio-jinhoo.pdf
          test ! -d _site/portfolio/server
          test ! -d _site/portfolio/servercore/docs
          if find _site/portfolio/servercore -type f \( -name '*.qmd' -o -name '*.md' \) | grep -q .; then
            echo "ServerCore source markdown leaked into _site" >&2
            exit 1
          fi

      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docs image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main

      - name: Checkout ops repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: mint-cocoa/mintcocoa-ops
          token: ${{ secrets.OPS_REPO_TOKEN }}
          path: mintcocoa-ops

      - name: Promote docs image to OKE
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          file="mintcocoa-ops/apps/mintcocoa-docs/overlays/oke-prod/kustomization.yaml"
          if [ ! -f "$file" ]; then
            echo "GitOps overlay is not present yet; skipping promotion."
            exit 0
          fi
          sed -i "s|newName: .*|newName: ${IMAGE_NAME}|" "$file"
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" "$file"
          cd mintcocoa-ops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mintcocoa-docs/overlays/oke-prod/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Promote mintcocoa-docs to ${GITHUB_SHA}"
          git push
