server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ^~ /portfolio/server/ {
    return 404;
  }

  location ^~ /portfolio/servercore/docs/ {
    return 404;
  }

  location = /portfolio/client/ClientPortfolio.html {
    return 404;
  }

  location = /portfolio/devops/DevOpsPortfolio.html {
    return 404;
  }

  location = /portfolio/devops/OciOkeGitOpsPortfolio.html {
    return 404;
  }

  location = /portfolio/devops/OpsDashboard.html {
    return 404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
