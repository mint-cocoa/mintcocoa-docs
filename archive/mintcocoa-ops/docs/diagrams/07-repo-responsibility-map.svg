<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR, Noto Sans KR, Segoe UI, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title id="title">mintcocoa-ops repository responsibility map</title>
  <desc id="desc">The repository separates Terraform cloud foundation, Kubernetes cluster roots, application overlays, shared infrastructure manifests, GitHub workflows, and documentation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.infra{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.gitops{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}.public{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.private{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.obs{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.chip{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.h{fill:#0f172a;font-size:31px;font-weight:700}.t{fill:#0f172a;font-size:20px;font-weight:700}.s{fill:#475569;font-size:16px}.xs{fill:#64748b;font-size:13px}.mono{font-family:Consolas,Segoe UI Mono,monospace;fill:#0f172a;font-size:14px}.line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.tealLine{stroke:#0f766e;stroke-width:2.4;fill:none;marker-end:url(#tealArrow)}.dash{stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="h" x="48" y="58">Repository responsibility map</text>
  <text class="s" x="48" y="86">파일 수를 줄이기보다 cloud foundation, desired state, app overlay, evidence 경계를 드러낸다.</text>

  <rect class="panel" x="42" y="122" width="1116" height="432" rx="14"/>
  <rect class="infra" x="82" y="190" width="230" height="116" rx="14"/>
  <text class="mono" x="126" y="230">terraform/azure</text>
  <text class="s" x="112" y="263">AKS, VNet, VPN,</text>
  <text class="s" x="112" y="286">Azure Monitor</text>

  <rect class="gitops" x="386" y="154" width="250" height="116" rx="14"/>
  <text class="mono" x="452" y="194">clusters</text>
  <text class="s" x="426" y="227">manager / staging / prod</text>
  <text class="s" x="426" y="250">root Applications</text>

  <rect class="public" x="386" y="350" width="250" height="116" rx="14"/>
  <text class="mono" x="480" y="390">apps</text>
  <text class="s" x="426" y="423">base와 staging/prod</text>
  <text class="s" x="426" y="446">overlay 차이</text>

  <rect class="private" x="710" y="154" width="250" height="116" rx="14"/>
  <text class="mono" x="744" y="194">infrastructure/kubernetes</text>
  <text class="s" x="750" y="227">cluster가 소비하는</text>
  <text class="s" x="750" y="250">공유 manifests</text>

  <rect class="obs" x="710" y="350" width="250" height="116" rx="14"/>
  <text class="mono" x="752" y="390">.github/workflows</text>
  <text class="s" x="750" y="423">render validation,</text>
  <text class="s" x="750" y="446">promotion PR</text>

  <rect class="chip" x="1002" y="252" width="116" height="116" rx="14"/>
  <text class="mono" x="1032" y="296">docs</text>
  <text class="xs" x="1022" y="326">state</text>
  <text class="xs" x="1022" y="348">runbooks</text>

  <path class="line" d="M 312 248 L 386 212"/>
  <path class="tealLine" d="M 636 212 L 710 212"/>
  <path class="tealLine" d="M 511 270 L 511 350"/>
  <path class="line" d="M 636 408 L 710 408"/>
  <path class="dash" d="M 960 212 C 1014 212 1060 232 1060 252"/>
  <path class="dash" d="M 960 408 C 1014 408 1060 388 1060 368"/>

  <rect class="chip" x="82" y="492" width="880" height="38" rx="9"/>
  <text class="s" x="108" y="517">Terraform은 cloud 기반을, GitOps는 Kubernetes 내부 desired state를, workflows는 검증과 승격 기록을 담당한다.</text>
  <text class="xs" x="48" y="590">source: README.md, docs/pipeline.md, repository layout</text>
</svg>
