<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR, Noto Sans KR, Segoe UI, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title id="title">OCI network boundary for MintCocoa production</title>
  <desc id="desc">VCN subnets, gateways, and operator IPSec access paths used by the MintCocoa OKE production cluster.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.vcn{fill:#fff;stroke:#64748b;stroke-width:1.5;stroke-dasharray:8 8}.public{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.private{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.infra{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.subnet{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.h{fill:#0f172a;font-size:31px;font-weight:700}.t{fill:#0f172a;font-size:20px;font-weight:700}.s{fill:#475569;font-size:16px}.xs{fill:#64748b;font-size:13px}.mono{font-family:Consolas,Segoe UI Mono,monospace;fill:#0f172a;font-size:14px}.blueLine{stroke:#2563eb;stroke-width:2.8;fill:none;marker-end:url(#blueArrow)}.purpleLine{stroke:#7c3aed;stroke-width:2.8;fill:none;marker-end:url(#purpleArrow)}.orangeLine{stroke:#ea580c;stroke-width:2.8;fill:none;marker-end:url(#orangeArrow)}.dash{stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="h" x="48" y="58">OCI VCN과 접근 경계</text>
  <text class="s" x="48" y="86">public ingress, pod outbound, private API, operator UI가 서로 다른 경로를 가진다.</text>

  <rect class="panel" x="42" y="122" width="244" height="398" rx="14"/>
  <text class="t" x="78" y="164">외부 / home LAN</text>
  <rect class="public" x="78" y="205" width="156" height="58" rx="10"/>
  <text class="mono" x="115" y="240">Internet</text>
  <rect class="private" x="78" y="315" width="156" height="58" rx="10"/>
  <text class="mono" x="114" y="350">172.30.1.0/24</text>
  <rect class="private" x="78" y="405" width="156" height="58" rx="10"/>
  <text class="mono" x="100" y="440">IPSec CPE .135</text>

  <rect class="vcn" x="346" y="122" width="812" height="398" rx="16"/>
  <text class="t" x="382" y="164">OCI VCN</text>
  <text class="mono" x="476" y="164">10.30.0.0/16</text>

  <rect class="subnet" x="390" y="205" width="170" height="96" rx="10"/>
  <text class="t" x="424" y="240">LB subnet</text>
  <text class="xs" x="420" y="268">public/private ingress LB</text>
  <rect class="subnet" x="604" y="205" width="170" height="96" rx="10"/>
  <text class="t" x="632" y="240">Endpoint subnet</text>
  <text class="xs" x="648" y="268">OKE private API</text>
  <rect class="subnet" x="818" y="205" width="170" height="96" rx="10"/>
  <text class="t" x="862" y="240">Workers</text>
  <text class="xs" x="858" y="268">3 arm64 nodes</text>

  <rect class="subnet" x="390" y="356" width="170" height="96" rx="10"/>
  <text class="t" x="430" y="391">Pod subnet</text>
  <text class="xs" x="420" y="419">VCN native pod IP</text>
  <rect class="subnet" x="604" y="356" width="170" height="96" rx="10"/>
  <text class="t" x="626" y="391">Management</text>
  <text class="mono" x="642" y="419">10.30.6.10</text>
  <rect class="infra" x="818" y="356" width="170" height="96" rx="10"/>
  <text class="t" x="856" y="391">Gateways</text>
  <text class="xs" x="852" y="419">IGW / NAT Gateway</text>

  <path class="blueLine" d="M 234 234 C 298 234 320 253 390 253"/>
  <path class="purpleLine" d="M 234 434 C 342 434 476 404 604 404"/>
  <path class="purpleLine" d="M 686 356 L 686 301"/>
  <path class="orangeLine" d="M 560 404 C 682 482 818 456 872 452"/>
  <path class="blueLine" d="M 904 356 L 904 301"/>
  <path class="dash" d="M 988 253 C 1074 253 1088 404 988 404"/>

  <text class="xs" x="390" y="554">public: Internet Gateway / private: Site-to-Site IPSec / outbound: NAT Gateway</text>
  <text class="xs" x="48" y="590">source: docs/current-state.md, archive/terraform/oci/network.tf, archive/terraform/oci/bastion.tf, archive/terraform/oci/ipsec.tf</text>
</svg>
