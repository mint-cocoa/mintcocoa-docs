<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes cluster structure</title>
  <desc id="desc">A Kubernetes cluster diagram showing a control plane, two worker nodes, pods, CRI runtimes, and an external cloud provider API.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111" />
    </marker>
    <style>
      .page { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .boundary { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
      .runtime { fill: #ffffff; stroke: #555555; stroke-width: 1.6; }
      .component { fill: #0f55e8; stroke: #083aa6; stroke-width: 2; }
      .component-light { fill: #29a3dc; stroke: #0c78ad; stroke-width: 2; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
      .label { font-size: 14px; }
      .small { font-size: 12px; }
      .title { font-size: 19px; font-weight: 700; }
      .node-title { font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
      .component-text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
      .pod-text { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .line { fill: none; stroke: #111111; stroke-width: 1.4; marker-end: url(#arrow); }
      .line-both { fill: none; stroke: #111111; stroke-width: 1.4; marker-start: url(#arrow); marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #555555; stroke-width: 1.4; stroke-dasharray: 3 4; marker-end: url(#arrow); }
      .dashed-plain { fill: none; stroke: #555555; stroke-width: 1.4; stroke-dasharray: 3 4; }
    </style>
  </defs>

  <rect class="page" x="1" y="1" width="1398" height="878" rx="6" />

  <rect class="boundary" x="70" y="52" width="1140" height="780" rx="7" />
  <text class="text title" x="640" y="82">CLUSTER</text>

  <rect class="boundary" x="114" y="82" width="330" height="690" rx="7" />
  <text class="text label" x="215" y="111">CONTROL PLANE</text>

  <rect class="component-light" x="181" y="162" width="218" height="84" rx="6" />
  <text class="component-text" x="193" y="209">cloud-controller-manager</text>

  <rect class="component" x="141" y="329" width="81" height="84" rx="6" />
  <text class="component-text" x="164" y="377">etcd</text>

  <rect class="component" x="281" y="329" width="151" height="84" rx="6" />
  <text class="component-text" x="296" y="377">kube-api-server</text>

  <rect class="component" x="126" y="511" width="141" height="84" rx="6" />
  <text class="component-text" x="160" y="559">scheduler</text>
  <text class="text small" x="158" y="615">kube-scheduler</text>

  <rect class="component" x="281" y="511" width="151" height="84" rx="6" />
  <text class="component-text" x="292" y="559">controller manager</text>
  <text class="text small" x="291" y="615">kube-controller-manager</text>

  <rect class="boundary" x="564" y="342" width="248" height="390" rx="7" />
  <text class="text node-title" x="663" y="362">Node 1</text>

  <rect class="component" x="581" y="412" width="98" height="68" rx="6" />
  <text class="component-text" x="602" y="452">kubelet</text>

  <rect class="component-light" x="692" y="412" width="111" height="68" rx="6" />
  <text class="component-text" x="705" y="452">kube-proxy</text>

  <rect class="runtime" x="592" y="547" width="191" height="164" />
  <rect class="component" x="611" y="562" width="61" height="60" rx="6" />
  <text class="pod-text" x="629" y="597">pod</text>
  <rect class="component" x="705" y="562" width="61" height="60" rx="6" />
  <text class="pod-text" x="723" y="597">pod</text>
  <rect class="component" x="661" y="634" width="61" height="60" rx="6" />
  <text class="pod-text" x="679" y="669">pod</text>
  <rect class="component" x="752" y="682" width="31" height="29" />
  <text class="pod-text" x="756" y="702">CRI</text>

  <rect class="boundary" x="851" y="342" width="263" height="390" rx="7" />
  <text class="text node-title" x="956" y="362">Node 2</text>

  <rect class="component" x="872" y="412" width="113" height="68" rx="6" />
  <text class="component-text" x="902" y="452">kubelet</text>

  <rect class="component-light" x="1008" y="408" width="94" height="68" rx="6" />
  <text class="component-text" x="1019" y="449">kube-proxy</text>

  <rect class="runtime" x="881" y="547" width="208" height="164" />
  <rect class="component" x="948" y="595" width="61" height="60" rx="6" />
  <text class="pod-text" x="966" y="630">pod</text>
  <rect class="component" x="1058" y="682" width="31" height="29" />
  <text class="pod-text" x="1062" y="702">CRI</text>

  <path class="line-both" d="M 222 356 L 281 356" />
  <path class="line-both" d="M 291 246 L 291 329" />
  <path class="line" d="M 196 511 L 196 462 L 262 462 L 262 371 L 281 371" />
  <path class="line" d="M 356 511 L 356 413" />

  <path class="dashed" d="M 400 202 H 1213" />
  <path class="line" d="M 629 412 V 372 H 432" />
  <path class="line" d="M 928 412 V 310 H 356 V 329" />
  <path class="dashed-plain" d="M 747 412 V 372 H 356 V 329" />
  <path class="dashed-plain" d="M 1055 408 V 310 H 356 V 329" />

  <path class="line" d="M 642 480 V 512 H 688 V 547" />
  <path class="line" d="M 758 480 V 547" />
  <path class="line" d="M 946 480 V 512 H 985 V 547" />
  <path class="line" d="M 1042 476 V 547" />

  <g transform="translate(1214 139)">
    <path d="M 44 28
             C 50 8, 77 0, 105 12
             C 127 -2, 162 10, 169 34
             C 190 36, 204 50, 204 70
             C 204 91, 188 103, 169 104
             C 160 122, 129 132, 100 126
             C 78 139, 43 130, 36 107
             C 17 107, 5 96, 5 81
             C 5 67, 16 57, 34 55
             C 33 43, 36 34, 44 28 z"
          fill="#29a3dc" stroke="#0c78ad" stroke-width="1.4" />
    <text class="component-text" x="26" y="67" font-size="13">CLOUD PROVIDER API</text>
  </g>
</svg>
