<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR, Noto Sans KR, Segoe UI, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title id="title">MintCocoa production architecture overview</title>
  <desc id="desc">Public service plane, GitOps control plane, and private operator plane for the MintCocoa OKE production platform.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.public{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.gitops{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}.private{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.infra{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.obs{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.chip{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.h{fill:#0f172a;font-size:31px;font-weight:700}.t{fill:#0f172a;font-size:20px;font-weight:700}.s{fill:#475569;font-size:16px}.xs{fill:#64748b;font-size:13px}.mono{font-family:Consolas,Segoe UI Mono,monospace;fill:#0f172a;font-size:14px}.line{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.blueLine{stroke:#2563eb;stroke-width:2.8;fill:none;marker-end:url(#blueArrow)}.tealLine{stroke:#0f766e;stroke-width:2.8;fill:none;marker-end:url(#tealArrow)}.purpleLine{stroke:#7c3aed;stroke-width:2.8;fill:none;marker-end:url(#purpleArrow)}.dash{stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="h" x="48" y="58">MintCocoa infra / DevOps 구조</text>
  <text class="s" x="48" y="86">작은 production 안에서 사용자 트래픽, GitOps 제어, 운영자 접근을 분리한다.</text>

  <rect class="panel" x="42" y="122" width="1116" height="436" rx="14"/>
  <rect class="public" x="76" y="170" width="300" height="282" rx="14"/>
  <text class="t" x="106" y="210">Public service plane</text>
  <text class="s" x="106" y="238">외부 사용자는 public DNS와</text>
  <text class="s" x="106" y="262">public ingress만 통과한다.</text>
  <rect class="chip" x="108" y="302" width="104" height="42" rx="8"/>
  <text class="mono" x="132" y="328">Internet</text>
  <rect class="chip" x="236" y="302" width="104" height="42" rx="8"/>
  <text class="mono" x="259" y="328">nginx</text>
  <rect class="chip" x="108" y="370" width="232" height="48" rx="8"/>
  <text class="mono" x="128" y="399">docs / drop / demo</text>

  <rect class="gitops" x="450" y="170" width="300" height="282" rx="14"/>
  <text class="t" x="480" y="210">GitOps control plane</text>
  <text class="s" x="480" y="238">desired state는 Git에 있고</text>
  <text class="s" x="480" y="262">Argo CD가 cluster로 수렴한다.</text>
  <rect class="chip" x="482" y="302" width="236" height="42" rx="8"/>
  <text class="mono" x="514" y="328">mintcocoa-ops</text>
  <rect class="chip" x="482" y="370" width="236" height="48" rx="8"/>
  <text class="mono" x="520" y="399">manager Argo CD</text>

  <rect class="private" x="824" y="170" width="300" height="282" rx="14"/>
  <text class="t" x="854" y="210">Private operator plane</text>
  <text class="s" x="854" y="238">운영 UI와 API는 home LAN</text>
  <text class="s" x="854" y="262">IPSec 경로로만 접근한다.</text>
  <rect class="chip" x="856" y="302" width="236" height="42" rx="8"/>
  <text class="mono" x="890" y="328">Raspberry Pi IPSec</text>
  <rect class="chip" x="856" y="370" width="236" height="48" rx="8"/>
  <text class="mono" x="902" y="399">argocd / grafana</text>

  <rect class="infra" x="402" y="486" width="396" height="54" rx="12"/>
  <text class="t" x="454" y="520">OCI OKE prod</text>
  <text class="mono" x="582" y="520">home-oci-oke-cluster</text>
  <rect class="obs" x="866" y="486" width="226" height="54" rx="12"/>
  <text class="t" x="906" y="520">home k3s staging</text>

  <path class="blueLine" d="M 212 344 C 300 344 314 513 402 513"/>
  <path class="tealLine" d="M 600 418 L 600 486"/>
  <path class="tealLine" d="M 600 418 C 716 430 768 499 866 513"/>
  <path class="purpleLine" d="M 974 344 C 918 432 840 505 798 513"/>
  <path class="dash" d="M 376 312 L 450 312"/>
  <path class="dash" d="M 750 312 L 824 312"/>

  <text class="xs" x="48" y="590">source: docs/current-state.md, docs/pipeline.md, clusters/*, archive/terraform/oci/*</text>
</svg>
