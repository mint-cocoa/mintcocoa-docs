<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR, Noto Sans KR, Segoe UI, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Production observability flow</title>
  <desc id="desc">Metrics, logs, and traces flow from production workloads and nodes into Prometheus, Loki, and Tempo, with Grafana exposed only through private ingress.</desc>
  <defs>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.work{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.obs{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.private{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.gitops{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}.chip{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.h{fill:#0f172a;font-size:31px;font-weight:700}.t{fill:#0f172a;font-size:20px;font-weight:700}.s{fill:#475569;font-size:16px}.xs{fill:#64748b;font-size:13px}.mono{font-family:Consolas,Segoe UI Mono,monospace;fill:#0f172a;font-size:14px}.tealLine{stroke:#0f766e;stroke-width:2.8;fill:none;marker-end:url(#tealArrow)}.purpleLine{stroke:#7c3aed;stroke-width:2.8;fill:none;marker-end:url(#purpleArrow)}.dash{stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="h" x="48" y="58">Observability flow</text>
  <text class="s" x="48" y="86">데이터 수집기는 cluster 내부에 있고, Grafana만 private ingress로 운영자에게 열린다.</text>

  <rect class="panel" x="46" y="122" width="1108" height="426" rx="14"/>
  <rect class="work" x="88" y="196" width="222" height="220" rx="14"/>
  <text class="t" x="128" y="236">Runtime sources</text>
  <rect class="chip" x="122" y="276" width="154" height="42" rx="8"/>
  <text class="mono" x="146" y="303">workloads</text>
  <rect class="chip" x="122" y="338" width="154" height="42" rx="8"/>
  <text class="mono" x="161" y="365">nodes</text>

  <rect class="obs" x="420" y="160" width="258" height="292" rx="14"/>
  <text class="t" x="466" y="200">Collectors / stores</text>
  <rect class="chip" x="456" y="238" width="186" height="42" rx="8"/>
  <text class="mono" x="504" y="265">Prometheus</text>
  <rect class="chip" x="456" y="300" width="186" height="42" rx="8"/>
  <text class="mono" x="522" y="327">Loki</text>
  <rect class="chip" x="456" y="362" width="186" height="42" rx="8"/>
  <text class="mono" x="522" y="389">Tempo</text>

  <rect class="private" x="790" y="196" width="222" height="220" rx="14"/>
  <text class="t" x="852" y="236">Grafana</text>
  <text class="s" x="834" y="270">운영자용 화면</text>
  <rect class="chip" x="808" y="316" width="186" height="42" rx="8"/>
  <text class="mono" x="850" y="343">private-nginx</text>
  <rect class="gitops" x="808" y="376" width="186" height="42" rx="8"/>
  <text class="mono" x="830" y="403">grafana.mintcocoa.dev</text>

  <path class="tealLine" d="M 310 270 L 456 258"/>
  <path class="tealLine" d="M 310 328 L 456 321"/>
  <path class="tealLine" d="M 310 386 L 456 383"/>
  <path class="tealLine" d="M 642 258 C 714 258 734 306 790 306"/>
  <path class="tealLine" d="M 642 321 L 790 321"/>
  <path class="tealLine" d="M 642 383 C 714 383 734 337 790 337"/>
  <path class="purpleLine" d="M 901 418 C 901 480 690 502 530 452"/>
  <path class="dash" d="M 1012 337 L 1098 337"/>

  <text class="xs" x="88" y="494">Prometheus, Loki, Tempo, Alertmanager는 ClusterIP 내부 경계에 남고 Grafana가 통합 조회 표면이 된다.</text>
  <text class="xs" x="48" y="590">source: docs/current-state.md, clusters/prod/observability/*, infrastructure/kubernetes/private-observability-ingress/*</text>
</svg>
