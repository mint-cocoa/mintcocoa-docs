<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR, Noto Sans KR, Segoe UI, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title id="title">GitOps control plane layout</title>
  <desc id="desc">The management Argo CD instance reads mintcocoa-ops and reconciles manager, staging, and production root applications.</desc>
  <defs>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.gitops{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}.infra{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.public{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.private{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4}.chip{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.h{fill:#0f172a;font-size:31px;font-weight:700}.t{fill:#0f172a;font-size:20px;font-weight:700}.s{fill:#475569;font-size:16px}.xs{fill:#64748b;font-size:13px}.mono{font-family:Consolas,Segoe UI Mono,monospace;fill:#0f172a;font-size:14px}.tealLine{stroke:#0f766e;stroke-width:2.8;fill:none;marker-end:url(#tealArrow)}.orangeLine{stroke:#ea580c;stroke-width:2.4;fill:none;marker-end:url(#orangeArrow)}.dash{stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="h" x="48" y="58">GitOps control plane</text>
  <text class="s" x="48" y="86">management k3s의 Argo CD가 repo를 읽고 manager, staging, prod 상태를 나누어 수렴한다.</text>

  <rect class="panel" x="50" y="132" width="210" height="340" rx="14"/>
  <text class="t" x="92" y="176">Git source</text>
  <rect class="gitops" x="82" y="220" width="146" height="66" rx="10"/>
  <text class="mono" x="102" y="259">mintcocoa-ops</text>
  <rect class="chip" x="82" y="330" width="146" height="48" rx="8"/>
  <text class="mono" x="108" y="360">Kustomize</text>

  <rect class="gitops" x="368" y="184" width="250" height="222" rx="14"/>
  <text class="t" x="414" y="226">manager Argo CD</text>
  <text class="s" x="414" y="255">single control plane</text>
  <rect class="chip" x="412" y="294" width="162" height="42" rx="8"/>
  <text class="mono" x="438" y="321">argocd namespace</text>

  <rect class="lane" x="732" y="122" width="374" height="110" rx="12"/>
  <text class="t" x="760" y="160">manager-root</text>
  <text class="mono" x="900" y="160">clusters/manager</text>
  <text class="xs" x="760" y="194">manager ingress-nginx, argocd private ingress</text>

  <rect class="lane" x="732" y="274" width="374" height="110" rx="12"/>
  <text class="t" x="760" y="312">staging-root</text>
  <text class="mono" x="900" y="312">clusters/staging</text>
  <text class="xs" x="760" y="346">home k3s validation workloads, automated sync</text>

  <rect class="lane" x="732" y="426" width="374" height="110" rx="12"/>
  <text class="t" x="760" y="464">prod-root</text>
  <text class="mono" x="900" y="464">clusters/prod</text>
  <text class="xs" x="760" y="498">ingress, platform, observability, workloads</text>

  <path class="tealLine" d="M 228 253 C 286 253 308 295 368 295"/>
  <path class="tealLine" d="M 618 252 C 670 220 686 178 732 177"/>
  <path class="tealLine" d="M 618 311 L 732 329"/>
  <path class="orangeLine" d="M 618 366 C 672 414 688 480 732 481"/>
  <path class="dash" d="M 493 406 L 493 494 L 732 494"/>

  <rect class="infra" x="78" y="506" width="1028" height="48" rx="10"/>
  <text class="s" x="108" y="536">production sync는 변경 감지 후 operator가 diff와 검증 결과를 보고 수동으로 실행한다.</text>
  <text class="xs" x="48" y="590">source: docs/pipeline.md, clusters/manager/*, clusters/staging/*, clusters/prod/*</text>
</svg>
